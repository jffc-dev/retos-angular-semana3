<section class="mx-auto max-w-md rounded-xl border border-gray-200 p-6 shadow-sm">
  <h2 class="text-xl font-semibold text-gray-900">Reto 5 · Medidor de fuerza de contraseña</h2>
  <p class="mt-1 text-sm text-gray-600">
    Pendiente: usa <code>ngStyle</code> para el ancho/color de la barra y
    <code>ngClass</code> para el color del texto según <code>nivel()</code>.
  </p>

  <input
    type="text"
    placeholder="Escribe una contraseña..."
    (input)="actualizarPassword($event)"
    class="mt-4 w-full rounded-md border border-gray-300 px-3 py-2 text-sm focus:border-slate-500 focus:outline-none"
  />

  <div class="mt-3 h-2 w-full overflow-hidden rounded-full bg-gray-200">
    <div class="h-full bg-gray-400"></div>
  </div>

  <p class="mt-2 text-sm font-medium text-gray-700">Nivel: {{ nivel() }}</p>
</section>
