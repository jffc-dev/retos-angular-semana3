<div class="min-h-screen bg-slate-100 p-6 lg:p-10">
  <header class="mb-8">
    <h1 class="text-3xl font-bold text-slate-800">Manejo de Inputs</h1>
    <p class="text-slate-500 mt-1">Reto 3: tres estrategias para leer lo que escribe el usuario</p>
  </header>

  <section class="space-y-6 max-w-2xl">

    <article class="bg-white rounded-xl p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700 mb-1">1. Template reference: <code>#valor</code></h2>

      <div class="flex flex-col sm:flex-row sm:items-center gap-3">
        <input
          #inputReferencia
          (input)="0"
          type="text"
          placeholder="Escribe tu ciudad..."
          class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm focus:border-slate-500 focus:outline-none"
        />
        <p class="text-sm text-slate-600">
          -> <span class="font-semibold text-slate-900">{{ inputReferencia.value }}</span>
        </p>
      </div>
    </article>





    <article class="bg-white rounded-xl p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700 mb-1">2. Signal de <code>model()</code> + <code>[(ngModel)]</code></h2>
      <div class="flex flex-col sm:flex-row sm:items-center gap-3">
        <input
          [(ngModel)]="inputModel"
          type="text"
          placeholder="Escribe tu nombre..."
          class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm focus:border-slate-500 focus:outline-none"
        />
        <p class="text-sm text-slate-600">
          -> <span class="font-semibold text-slate-900">{{ inputModel() }}</span>
        </p>
      </div>
    </article>





    <article class="bg-white rounded-xl p-5 shadow-sm">
      <h2 class="text-sm font-semibold text-slate-700 mb-1">3. <code>signal()</code> + binding manual</h2>

      <div class="flex flex-col sm:flex-row sm:items-center gap-3">
        <input
          type="email"
          (input)="actualizarInputSignal($event)"
          placeholder="Escribe tu correo..."
          class="flex-1 rounded-lg border border-slate-300 px-4 py-2 text-sm focus:border-slate-500 focus:outline-none"
        />
        <p class="text-sm text-slate-600">
          -> <span class="font-semibold text-slate-900">{{ inputSignal() }}</span>
        </p>
      </div>
    </article>

  </section>
</div>
