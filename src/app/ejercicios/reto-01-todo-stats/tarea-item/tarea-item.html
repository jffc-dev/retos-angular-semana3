<li class="flex items-center gap-2 rounded-md border border-gray-200 px-3 py-2">
  <input
    type="checkbox"
    [checked]="tarea().completada"
    (change)="alternarCompletada()"
  />
  <span
    class="flex-1 text-sm"
    [class.line-through]="tarea().completada"
    [class.text-gray-400]="tarea().completada"
  >
    {{ tarea().texto }}
  </span>
  <button
    type="button"
    (click)="eliminarTarea()"
    class="text-xs text-red-600 hover:underline"
  >
    Eliminar
  </button>
</li>
